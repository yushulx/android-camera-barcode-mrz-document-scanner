plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dynamsoft.barcodebenchmark'
    compileSdk 34

    defaultConfig {
        applicationId "com.dynamsoft.barcodebenchmark"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}


def getVersion(String productSimpleName, String defaultValue) {
    if (rootProject.ext.has("versions")) {
        return rootProject.ext.get("versions").get(productSimpleName) != null ?
                rootProject.ext.get("versions").get(productSimpleName) : defaultValue
    } else {
        return defaultValue
    }
}

dependencies {
    implementation 'com.dynamsoft:barcodereaderbundle:11.2.5000'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.5.1'
    implementation 'androidx.navigation:navigation-ui:2.5.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    // Google ML Kit for barcode scanning
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // NanoHTTPD for embedded web server
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // ZXing-C++ Android wrapper (exclude transitive CameraX which requires minSdk 23 + AGP 8.6)
    implementation('io.github.zxing-cpp:android:3.0.2') {
        exclude group: 'androidx.camera'
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}